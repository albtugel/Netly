services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netly
      POSTGRES_PASSWORD: netly
      POSTGRES_DB: netly_profile
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netly"]
      interval: 5s
      retries: 10

  profile:
    build: ./services/profile-service
    environment:
      DATABASE_URL: postgres://netly:netly@postgres:5432/netly_profile
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  budget:
    build: ./services/budget-service
    environment:
      DATABASE_URL: postgres://netly:netly@postgres:5432/netly_budget
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PROFILE_SERVICE_URL: http://profile:8081
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      profile:
        condition: service_started

volumes:
  pgdata:
