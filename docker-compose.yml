services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-netly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-netly}
      POSTGRES_DB: netly_profile
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  # One-shot: creates or updates the users table, then exits. `profile` starts only after it succeeds.
  profile-migrate:
    build: ./services/profile-service
    image: netly-profile
    command: ["migrate", "--yes"]
    environment: &profile-database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: netly_profile
      DB_USER: ${DB_USER:-netly}
      DB_PASSWORD: ${DB_PASSWORD:-netly}
    depends_on:
      postgres:
        condition: service_healthy

  profile:
    build: ./services/profile-service
    image: netly-profile
    environment:
      <<: *profile-database
      JWT_SECRET: ${JWT_SECRET:-netly-dev-jwt-secret-change-me-32bytes}
    ports:
      - "8081:8081"
    depends_on:
      profile-migrate:
        condition: service_completed_successfully

  # One-shot: applies pending migrations, then exits. `budget` starts only after it succeeds.
  budget-migrate:
    build: ./services/budget-service
    image: netly-budget
    command: ["migrate"]
    environment: &budget-database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: netly_budget
      DB_USER: ${DB_USER:-netly}
      DB_PASSWORD: ${DB_PASSWORD:-netly}
    depends_on:
      postgres:
        condition: service_healthy

  budget:
    build: ./services/budget-service
    image: netly-budget
    environment:
      <<: *budget-database
      JWT_SECRET: ${JWT_SECRET:-netly-dev-jwt-secret-change-me-32bytes}
      PROFILE_SERVICE_URL: http://profile:8081
    ports:
      - "8082:8082"
    depends_on:
      budget-migrate:
        condition: service_completed_successfully
      profile:
        condition: service_started

volumes:
  pgdata:
